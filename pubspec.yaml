name: sdahymnal
description: Old and New SDA Hymnal

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# In Android, build-name is used as versionName while build-number used as versionCode.
#
# versionCode scheme (since 4.0.0): major * 10000 + minor * 100 + patch.
# The pre-2026 releases were Cordova builds whose codes were single digits, so
# this scheme clears them by a wide margin and stays monotonic forever. Play
# rejects a versionCode it has seen before — always bump before uploading.
version: 4.5.0+40500

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  intl: ^0.20.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_html: ^3.0.0
  html: ^0.15.6
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  auto_size_text: ^3.0.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.0
  wakelock_plus: ^1.7.0
  youtube_player_iframe: ^6.0.2
  sqflite: ^2.4.3
  crypto: ^3.0.7
  archive: 4.0.9
  unorm_dart: ^0.3.2
  sqflite_common: ^2.5.11
  share_plus: ^13.3.1
  audio_service: ^0.18.19
  audio_session: ^0.2.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D3F30"
  adaptive_icon_foreground: "assets/icon_foreground.png"

# path_provider_android 2.3.x pulls the experimental `jni` package whose
# Gradle script is incompatible with this project's AGP; pin to the last
# stable pre-jni release until that settles.
dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^5.0.0
  wakelock_plus_platform_interface: ^1.6.0
  shared_preferences_platform_interface: ^2.4.2
  sqflite_common_ffi: ^2.4.2+1
  integration_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/hymnals/
    - assets/hymns.json
    - assets/hymn_metadata.json
    - assets/hymn_videos.json
    - assets/additional_readings.json
    - assets/sheet_music/catalog.json
    - assets/sheet_music/en_1985/
    - assets/sheet_music/es_2009/
    - assets/sheet_music/ru_1997/
    - assets/logo.svg
    - assets/logo-mark.svg
    - assets/logo-mark-dark.svg
    - assets/lettern.svg
    - assets/lettero.svg
    - assets/icon.png
    - assets/flag.png
    - assets/sp.png
    - assets/rohan.jpg
    - assets/release_notes.json
    - assets/brand/
    - assets/midi/

  fonts:
    - family: PinyonScript
      fonts:
        - asset: assets/fonts/PinyonScript-Regular.ttf
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-400.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-500.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-600.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-700.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-400.ttf
          weight: 400
        - asset: assets/fonts/Literata-500.ttf
          weight: 500
        - asset: assets/fonts/Literata-600.ttf
          weight: 600
        - asset: assets/fonts/Literata-700.ttf
          weight: 700
        - asset: assets/fonts/Literata-400-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Literata-500-Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Literata-600-Italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Literata-700-Italic.ttf
          weight: 700
          style: italic
