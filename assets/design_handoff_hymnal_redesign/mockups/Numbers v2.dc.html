<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<style>
:root{--bg:#FAFAF7;--surface:#ffffff;--surface2:#F0F1EE;--ink:#131714;--muted:#6E7873;--faint:#9AA39D;--line:#E5E8E4;--line2:#EEF0EC;--accent:#176A50;--accent-hi:#1E8A63;--deep:#0D3F30;--tint:#EAF1EC;--gold:#A87E2F;--gold-bg:rgba(168,126,47,0.1);--key:#ffffff;--kshadow:0 1px 2px rgba(16,21,15,0.04);--glow:none;--marktile:#0D3F30;--markpipe:#EAF1EC;--markpipe2:#7FD6B4;--onaccent:#ffffff}
:root[data-theme="dark"]{--bg:#0C110E;--surface:rgba(255,255,255,0.045);--surface2:rgba(255,255,255,0.04);--ink:#F2F4F0;--muted:#93A099;--faint:#5D6862;--line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.07);--accent:#3ECF95;--accent-hi:#5FDCAA;--deep:#0D3F30;--tint:rgba(62,207,149,0.12);--gold:#D8C289;--gold-bg:rgba(216,194,137,0.1);--key:rgba(255,255,255,0.05);--kshadow:none;--glow:radial-gradient(560px 300px at 50% -90px,rgba(30,138,99,0.18),rgba(30,138,99,0) 70%);--marktile:rgba(255,255,255,0.08);--markpipe:#DFE6E0;--markpipe2:#3ECF95;--onaccent:#0C110E}
html,body{margin:0;padding:0;background:var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hi)}
input::placeholder{color:var(--faint)}
@keyframes omCaret{0%,55%{opacity:1}56%,100%{opacity:0}}
</style>
</helmet>
<div data-screen-label="Numbers (home)" style="width:100%;height:100vh;background-image:var(--glow);background-color:var(--bg);color:var(--ink);font-family:'Instrument Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="height:52px;display:flex;align-items:center;gap:9px;padding:0 24px;flex:none">
    <svg width="26" height="26" viewBox="0 0 26 26"><rect width="26" height="26" rx="7" style="fill:var(--marktile)"></rect><rect x="6.5" y="10" width="2.6" height="9" rx="1.3" style="fill:var(--markpipe)"></rect><rect x="11.7" y="6.5" width="2.6" height="12.5" rx="1.3" style="fill:var(--markpipe)"></rect><rect x="16.9" y="12" width="2.6" height="7" rx="1.3" style="fill:var(--markpipe2)"></rect></svg>
    <span style="font-size:15.5px;letter-spacing:-0.01em"><span style="font-family:Literata,serif;font-style:italic;font-weight:500;color:var(--accent)">Old &amp; New</span> <span style="font-weight:700">SDA Hymnal</span></span>
  </div>
  <div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">
  <div style="text-align:center;margin-top:clamp(6px,2vh,20px);flex:none">
    <div style="font-size:11px;font-weight:600;letter-spacing:0.14em;color:var(--muted)">HYMN NUMBER</div>
    <div style="font-family:Literata,serif;font-size:clamp(46px,8vh,62px);font-weight:600;line-height:1.15;letter-spacing:0.02em;display:flex;align-items:center;justify-content:center;gap:2px;min-height:1.15em">{{ display }}<span style="width:2px;height:0.68em;background:var(--accent-hi);border-radius:1px;margin-left:4px;animation:omCaret 1.2s infinite"></span></div>
  </div>
  <sc-if value="{{ hasRecents }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;flex:none">
      <span style="font-size:11px;color:var(--muted);margin-right:2px">Recent</span>
      <sc-for list="{{ recents }}" as="r" hint-placeholder-count="3">
        <button onClick="{{ r.open }}" style="font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--ink);cursor:pointer" style-active="transform:scale(0.94)">{{ r.n }}</button>
      </sc-for>
    </div>
  </sc-if>
  <div style="min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 20px 16px;flex:none">
    <sc-if value="{{ hasNum }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ openNew }}" style="display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--kshadow);cursor:{{ newCursor }}" style-active="transform:scale(0.985)">
        <span style="font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--accent);background:var(--tint);border-radius:999px;padding:4px 9px;flex:none">NEW</span>
        <span style="font-family:Literata,serif;font-size:16.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:{{ newCol }};font-style:{{ newItal }}">{{ newTitle }}</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex:none;display:{{ newChev }}"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div onClick="{{ openOld }}" style="display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--kshadow);cursor:pointer" style-active="transform:scale(0.985)">
        <span style="font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--muted);background:var(--surface2);border-radius:999px;padding:4px 9px;flex:none">OLD</span>
        <span style="font-family:Literata,serif;font-size:16.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ oldTitle }}</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </sc-if>
    <sc-if value="{{ noNum }}" hint-placeholder-val="{{ true }}">
      <div style="text-align:center;font-size:13px;color:var(--faint)">Type a hymn number to preview it here<br><span style="font-size:11.5px">New Hymnal 1–695 · Old Hymnal 1–703</span></div>
    </sc-if>
  </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding:6px 20px 14px;flex:none">
    <sc-for list="{{ keys }}" as="c" hint-placeholder-count="12">
      <button onClick="{{ c.tap }}" style="height:clamp(44px,6.5vh,56px);display:flex;align-items:center;justify-content:center;font-family:'Instrument Sans',sans-serif;font-size:23px;font-weight:600;color:var(--ink);background:{{ c.bg }};border:1px solid var(--line);border-radius:14px;box-shadow:var(--kshadow);cursor:pointer;padding:0" style-active="transform:scale(0.95);background:var(--tint)">
        <span style="display:{{ c.textDisp }}">{{ c.label }}</span>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:{{ c.clearDisp }}"><path d="M4.5 4.5 L13.5 13.5 M13.5 4.5 L4.5 13.5" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <svg width="24" height="20" viewBox="0 0 24 20" fill="none" style="display:{{ c.backDisp }}"><path d="M8.5 3.5 H20 V16.5 H8.5 L3 10 Z" stroke="var(--muted)" stroke-width="1.6" stroke-linejoin="round"></path><path d="M11.5 7.5 L16.5 12.5 M16.5 7.5 L11.5 12.5" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"></path></svg>
      </button>
    </sc-for>
  </div>
  <div style="height:76px;border-top:1px solid var(--line);display:flex;padding-bottom:12px;flex:none">
    <a href="Numbers%20v2.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" style="fill:var(--accent)"><circle cx="5.5" cy="5.5" r="1.8"></circle><circle cx="11" cy="5.5" r="1.8"></circle><circle cx="16.5" cy="5.5" r="1.8"></circle><circle cx="5.5" cy="11" r="1.8"></circle><circle cx="11" cy="11" r="1.8"></circle><circle cx="16.5" cy="11" r="1.8"></circle><circle cx="11" cy="16.5" r="1.8"></circle></svg>
      <span style="font-size:10.5px;font-weight:600;color:var(--accent)">Numbers</span>
    </a>
    <a href="Search%20v2.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="10" cy="10" r="6" stroke="var(--faint)" stroke-width="1.6"></circle><path d="M14.5 14.5 L18.5 18.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="font-size:10.5px;font-weight:500;color:var(--faint)">Search</span>
    </a>
    <a href="Settings%20v2.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 7 H18 M4 15 H18" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round"></path><circle cx="8" cy="7" r="2.4" style="fill:var(--bg)" stroke="var(--faint)" stroke-width="1.6"></circle><circle cx="14" cy="15" r="2.4" style="fill:var(--bg)" stroke="var(--faint)" stroke-width="1.6"></circle></svg>
      <span style="font-size:10.5px;font-weight:500;color:var(--faint)">Settings</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 844}}">
class Component extends DCLogic {
  state = { display: "", loaded: false, recents: [] };
  news = []; olds = [];
  componentDidMount() {
    this.applyTheme();
    try { this.setState({ recents: JSON.parse(localStorage.getItem('hymnalRecents') || '[]').slice(0, 3) }); } catch (e) {}
    fetch('assets/hymns.json').then(r => r.json()).then(d => {
      this.news = d.hymns.filter(h => h.version === 'new');
      this.olds = d.hymns.filter(h => h.version === 'old');
      this.setState({ loaded: true });
    });
  }
  applyTheme() {
    const t = localStorage.getItem('theme') || 'light';
    const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  }
  titleFor(list, n) { const h = list.find(x => x.number === n); return h ? h.title : ''; }
  press(d) {
    const s = this.state.display;
    if (s.length >= 3) return;
    const nn = parseInt(s + d, 10);
    if (nn > 703 || nn < 1) return;
    this.setState({ display: s + d });
  }
  open(v) {
    const n = parseInt(this.state.display, 10);
    if (!n) return;
    if (v === 'new' && n > 695) return;
    location.href = 'Hymn%20Page%20v2.dc.html?v=' + v + '&n=' + n;
  }
  renderVals() {
    const s = this.state.display;
    const n = s ? parseInt(s, 10) : 0;
    const hasNum = n >= 1;
    const newOk = hasNum && n <= 695;
    const keyDefs = ['1','2','3','4','5','6','7','8','9','clear','0','back'];
    const keys = keyDefs.map(k => ({
      label: (k === 'clear' || k === 'back') ? '' : k,
      textDisp: (k === 'clear' || k === 'back') ? 'none' : 'inline',
      clearDisp: k === 'clear' ? 'block' : 'none',
      backDisp: k === 'back' ? 'block' : 'none',
      bg: (k === 'clear' || k === 'back') ? 'var(--surface2)' : 'var(--key)',
      tap: k === 'clear' ? () => this.setState({ display: '' })
        : k === 'back' ? () => this.setState({ display: this.state.display.slice(0, -1) })
        : () => this.press(k)
    }));
    return {
      display: s,
      hasNum, noNum: !hasNum,
      newTitle: hasNum ? (newOk ? this.titleFor(this.news, n) : 'Not in the New Hymnal') : '',
      oldTitle: hasNum ? this.titleFor(this.olds, n) : '',
      newCol: newOk ? 'var(--ink)' : 'var(--faint)',
      newItal: newOk ? 'normal' : 'italic',
      newChev: newOk ? 'block' : 'none',
      newCursor: newOk ? 'pointer' : 'default',
      openNew: () => this.open('new'),
      openOld: () => this.open('old'),
      keys,
      hasRecents: this.state.recents.length > 0,
      recents: this.state.recents.map(r => ({ n: r.n, open: () => { location.href = 'Hymn%20Page%20v2.dc.html?v=' + r.v + '&n=' + r.n; } }))
    };
  }
}
</script>
</body>
</html>
