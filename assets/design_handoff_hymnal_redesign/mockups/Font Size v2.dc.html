<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<style>
:root{--bg:#FAFAF7;--surface:#ffffff;--surface2:#F0F1EE;--ink:#131714;--muted:#6E7873;--faint:#9AA39D;--line:#E5E8E4;--line2:#EEF0EC;--accent:#176A50;--accent-hi:#1E8A63;--deep:#0D3F30;--tint:#EAF1EC;--gold:#A87E2F;--gold-bg:rgba(168,126,47,0.1);--key:#ffffff;--kshadow:0 1px 2px rgba(16,21,15,0.04);--glow:none;--marktile:#0D3F30;--markpipe:#EAF1EC;--markpipe2:#7FD6B4;--onaccent:#ffffff}
:root[data-theme="dark"]{--bg:#0C110E;--surface:rgba(255,255,255,0.045);--surface2:rgba(255,255,255,0.04);--ink:#F2F4F0;--muted:#93A099;--faint:#5D6862;--line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.07);--accent:#3ECF95;--accent-hi:#5FDCAA;--deep:#0D3F30;--tint:rgba(62,207,149,0.12);--gold:#D8C289;--gold-bg:rgba(216,194,137,0.1);--key:rgba(255,255,255,0.05);--kshadow:none;--glow:none;--marktile:rgba(255,255,255,0.08);--markpipe:#DFE6E0;--markpipe2:#3ECF95;--onaccent:#0C110E}
html,body{margin:0;padding:0;background:var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hi)}
</style>
</helmet>
<div data-screen-label="Font Size" style="width:100%;height:100vh;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="height:56px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line2);flex:none">
    <a href="Settings%20v2.dc.html" style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:12px">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4 L6.5 10 L12.5 16" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <span style="font-size:16.5px;font-weight:600;flex:1;text-align:center">Font Size</span>
    <span style="width:42px;flex:none"></span>
  </div>
  <div style="flex:1;overflow-y:auto;min-height:0">
    <div style="margin:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--kshadow);padding:18px 18px 8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-size:13px;font-weight:600;color:var(--muted)">Lyrics size</span>
        <span style="font-family:Literata,serif;font-size:17px;font-weight:600;color:var(--accent)">{{ fsLabel }}</span>
      </div>
      <div onPointerDown="{{ dragStart }}" style="position:relative;height:48px;display:flex;align-items:center;cursor:pointer;padding:0 13px;touch-action:none">
        <div style="position:relative;width:100%;height:4px;border-radius:2px;background:var(--surface2)">
          <div style="position:absolute;left:0;top:0;height:4px;border-radius:2px;background:var(--accent);width:{{ pct }}"></div>
          <div style="position:absolute;top:50%;left:{{ pct }};transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#ffffff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(16,21,15,0.18)"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;padding:0 6px 10px">
        <span style="font-family:Literata,serif;font-size:12px;color:var(--faint)">A</span>
        <span style="font-family:Literata,serif;font-size:19px;color:var(--faint)">A</span>
      </div>
    </div>
    <div style="padding:2px 24px 6px;font-size:11px;font-weight:600;letter-spacing:0.14em;color:var(--muted)">PREVIEW</div>
    <div style="max-width:560px;margin:0 auto;padding:8px 24px 60px">
      <div style="font-family:Literata,serif;font-size:{{ fsPx }};line-height:1.7;color:var(--ink)">{{ sampleNode }}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 844}}">
class Component extends DCLogic {
  state = { fs: parseFloat(localStorage.getItem('fontSize') || '18') };
  sample = "<font color=\"#0B6138\"><b>1</b></font><br>\nAll creatures of our God and King,<br>\nLift up your voice with us and sing:<br>\nAlleluia! Alleluia!<br>\nO burning sun with golden beam<br>\nAnd silver moon with softer gleam:<br>\n<br>\n<i><b><font color=\"#CD9B1D\">CHORUS:</font></b><br>\nOh, praise Him! Oh, praise Him!<br>\nAlleluia, alleluia, alleluia!<br>\n</i>";
  componentDidMount() {
    const t = localStorage.getItem('theme') || 'light';
    const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  }
  styleBody(html) {
    return html
      .replace(/<font color="#0B6138"><b>(\d+)<\/b><\/font>/g, '<span style="font-family:\'Instrument Sans\',sans-serif;font-size:0.68em;font-weight:700;letter-spacing:0.14em;color:var(--accent)">$1</span>')
      .replace(/<font color="#CD9B1D">CHORUS:<\/font>/g, '<span style="font-family:\'Instrument Sans\',sans-serif;font-size:0.62em;font-weight:700;letter-spacing:0.14em;color:var(--gold);font-style:normal">CHORUS</span>')
      .replace(/<font color="([^"]*)"[^>]*>/g, '<span>')
      .replace(/<\/font>/g, '</span>');
  }
  setFromEvent(e, track) {
    const r = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const fs = Math.round(16 + frac * 14);
    localStorage.setItem('fontSize', String(fs));
    this.setState({ fs });
  }
  renderVals() {
    const fs = this.state.fs;
    return {
      pct: ((fs - 16) / 14 * 100) + '%',
      fsPx: fs + 'px',
      fsLabel: fs + ' pt',
      sampleNode: React.createElement('div', { dangerouslySetInnerHTML: { __html: this.styleBody(this.sample) } }),
      dragStart: (e) => {
        const track = e.currentTarget.firstElementChild;
        e.currentTarget.setPointerCapture(e.pointerId);
        this.setFromEvent(e, track);
        const mv = (ev) => this.setFromEvent(ev, track);
        const up = () => {
          window.removeEventListener('pointermove', mv);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', mv);
        window.addEventListener('pointerup', up);
      }
    };
  }
}
</script>
</body>
</html>
