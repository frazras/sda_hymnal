<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<style>
:root{--bg:#FAFAF7;--surface:#ffffff;--surface2:#F0F1EE;--ink:#131714;--muted:#6E7873;--faint:#9AA39D;--line:#E5E8E4;--line2:#EEF0EC;--accent:#176A50;--accent-hi:#1E8A63;--deep:#0D3F30;--tint:#EAF1EC;--gold:#A87E2F;--gold-bg:rgba(168,126,47,0.1);--key:#ffffff;--kshadow:0 1px 2px rgba(16,21,15,0.04);--glow:none;--marktile:#0D3F30;--markpipe:#EAF1EC;--markpipe2:#7FD6B4;--onaccent:#ffffff}
:root[data-theme="dark"]{--bg:#0C110E;--surface:rgba(255,255,255,0.045);--surface2:rgba(255,255,255,0.04);--ink:#F2F4F0;--muted:#93A099;--faint:#5D6862;--line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.07);--accent:#3ECF95;--accent-hi:#5FDCAA;--deep:#0D3F30;--tint:rgba(62,207,149,0.12);--gold:#D8C289;--gold-bg:rgba(216,194,137,0.1);--key:rgba(255,255,255,0.05);--kshadow:none;--glow:radial-gradient(560px 300px at 50% -90px,rgba(30,138,99,0.18),rgba(30,138,99,0) 70%);--marktile:rgba(255,255,255,0.08);--markpipe:#DFE6E0;--markpipe2:#3ECF95;--onaccent:#0C110E}
html,body{margin:0;padding:0;background:var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hi)}
</style>
</helmet>
<div data-screen-label="Settings" style="width:100%;height:100vh;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="height:52px;display:flex;align-items:center;gap:9px;padding:0 24px;flex:none">
    <svg width="26" height="26" viewBox="0 0 26 26"><rect width="26" height="26" rx="7" style="fill:var(--marktile)"></rect><rect x="6.5" y="10" width="2.6" height="9" rx="1.3" style="fill:var(--markpipe)"></rect><rect x="11.7" y="6.5" width="2.6" height="12.5" rx="1.3" style="fill:var(--markpipe)"></rect><rect x="16.9" y="12" width="2.6" height="7" rx="1.3" style="fill:var(--markpipe2)"></rect></svg>
    <span style="font-size:15.5px;letter-spacing:-0.01em"><span style="font-family:Literata,serif;font-style:italic;font-weight:500;color:var(--accent)">Old &amp; New</span> <span style="font-weight:700">SDA Hymnal</span></span>
  </div>
  <div style="flex:1;overflow-y:auto;min-height:0;padding-bottom:20px">
    <div style="padding:18px 24px 8px;font-size:11px;font-weight:600;letter-spacing:0.14em;color:var(--muted)">APPEARANCE</div>
    <div style="margin:0 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--kshadow);padding:12px">
      <div style="display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:4px">
        <sc-for list="{{ themes }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.tap }}" style="flex:1;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 0;border:none;border-radius:9px;background:{{ t.bg }};color:{{ t.fg }};box-shadow:{{ t.sh }};cursor:pointer">{{ t.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="padding:22px 24px 8px;font-size:11px;font-weight:600;letter-spacing:0.14em;color:var(--muted)">READING</div>
    <div style="margin:0 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--kshadow)">
      <a href="Font%20Size%20v2.dc.html" style="display:flex;align-items:center;gap:14px;padding:15px 16px;color:var(--ink)">
        <span style="font-family:Literata,serif;font-size:16px;font-weight:600;color:var(--muted);flex:none">Aa</span>
        <span style="font-size:15px;font-weight:500;flex:1">Font Size</span>
        <span style="font-size:13px;color:var(--muted)">{{ fsLabel }}</span>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
    </div>
    <div style="padding:22px 24px 8px;font-size:11px;font-weight:600;letter-spacing:0.14em;color:var(--muted)">MORE</div>
    <div style="margin:0 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--kshadow)">
      <a href="About%20v2.dc.html" style="display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--ink);border-bottom:1px solid var(--line2)">
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none" style="flex:none"><circle cx="11" cy="7.5" r="3.2" stroke="var(--muted)" stroke-width="1.6"></circle><path d="M4.5 18c1.2-3.4 11.8-3.4 13 0" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:500">About Us</span><span style="font-size:12.5px;color:var(--muted)">Who made this app?</span></span>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <a href="Donate%20v2.dc.html" style="display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--ink);border-bottom:1px solid var(--line2)">
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none" style="flex:none"><path d="M11 18.2s-6.6-4.1-6.6-8.6a3.7 3.7 0 016.6-2.2 3.7 3.7 0 016.6 2.2c0 4.5-6.6 8.6-6.6 8.6z" stroke="var(--muted)" stroke-width="1.6" stroke-linejoin="round"></path></svg>
        <span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:500">Donate</span><span style="font-size:12.5px;color:var(--muted)">Support the development</span></span>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <a href="Other%20Projects%20v2.dc.html" style="display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--ink)">
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none" style="flex:none"><rect x="4" y="4" width="6" height="6" rx="1.8" stroke="var(--muted)" stroke-width="1.6"></rect><rect x="12.5" y="4" width="6" height="6" rx="1.8" stroke="var(--muted)" stroke-width="1.6"></rect><rect x="4" y="12.5" width="6" height="6" rx="1.8" stroke="var(--muted)" stroke-width="1.6"></rect><rect x="12.5" y="12.5" width="6" height="6" rx="1.8" stroke="var(--muted)" stroke-width="1.6"></rect></svg>
        <span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:500">Our Other Projects</span><span style="font-size:12.5px;color:var(--muted)">Like this app? You will love our ministry!</span></span>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px 0 8px">
      <svg width="22" height="22" viewBox="0 0 26 26"><rect width="26" height="26" rx="7" style="fill:var(--marktile)"></rect><rect x="6.5" y="10" width="2.6" height="9" rx="1.3" style="fill:var(--markpipe)"></rect><rect x="11.7" y="6.5" width="2.6" height="12.5" rx="1.3" style="fill:var(--markpipe)"></rect><rect x="16.9" y="12" width="2.6" height="7" rx="1.3" style="fill:var(--markpipe2)"></rect></svg>
      <span style="font-size:12px;color:var(--muted)">Old &amp; New SDA Hymnal</span>
      <span style="font-size:11px;color:var(--faint)">Version 2.0</span>
    </div>
  </div>
  <div style="height:76px;border-top:1px solid var(--line);display:flex;padding-bottom:12px;flex:none;background:var(--bg)">
    <a href="Numbers%20v2.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" style="fill:var(--faint)"><circle cx="5.5" cy="5.5" r="1.8"></circle><circle cx="11" cy="5.5" r="1.8"></circle><circle cx="16.5" cy="5.5" r="1.8"></circle><circle cx="5.5" cy="11" r="1.8"></circle><circle cx="11" cy="11" r="1.8"></circle><circle cx="16.5" cy="11" r="1.8"></circle><circle cx="11" cy="16.5" r="1.8"></circle></svg>
      <span style="font-size:10.5px;font-weight:500;color:var(--faint)">Numbers</span>
    </a>
    <a href="Search%20v2.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="10" cy="10" r="6" stroke="var(--faint)" stroke-width="1.6"></circle><path d="M14.5 14.5 L18.5 18.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="font-size:10.5px;font-weight:500;color:var(--faint)">Search</span>
    </a>
    <a href="Settings%20v2.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 7 H18 M4 15 H18" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"></path><circle cx="8" cy="7" r="2.4" style="fill:var(--bg)" stroke="var(--accent)" stroke-width="1.8"></circle><circle cx="14" cy="15" r="2.4" style="fill:var(--bg)" stroke="var(--accent)" stroke-width="1.8"></circle></svg>
      <span style="font-size:10.5px;font-weight:600;color:var(--accent)">Settings</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 844}}">
class Component extends DCLogic {
  state = { theme: localStorage.getItem('theme') || 'light', fs: parseFloat(localStorage.getItem('fontSize') || '18') };
  componentDidMount() { this.applyTheme(); }
  applyTheme() {
    const t = this.state.theme;
    const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  }
  setTheme(t) {
    localStorage.setItem('theme', t);
    this.setState({ theme: t }, () => this.applyTheme());
  }
  renderVals() {
    const cur = this.state.theme;
    return {
      fsLabel: Math.round(this.state.fs) + ' pt',
      themes: [['light', 'Light'], ['dark', 'Dark'], ['system', 'System']].map(([k, label]) => ({
        label,
        bg: cur === k ? 'var(--surface)' : 'transparent',
        fg: cur === k ? 'var(--accent)' : 'var(--muted)',
        sh: cur === k ? 'var(--kshadow)' : 'none',
        tap: () => this.setTheme(k)
      }))
    };
  }
}
</script>
</body>
</html>
